<!doctype html>
<html lang="hun">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>homerseklet-adatok</title>
  </head>
  <body>
    <h1>Hőmérséklet adatok</h1>

    <h2>Adatok hozzáadása</h2>

    <form id="adatokBekuldese">
      <div>
        <label for="nap">Nap</label>
        <select name="nap" id="nap">
          <option value="hetfo">Hétfő</option>
          <option value="kedd">Kedd</option>
          <option value="szerda">Szerda</option>
          <option value="csutortok">Csütörtök</option>
          <option value="pentek">Péntek</option>
          <option value="szombat">Szombat</option>
          <option value="vasarnap">Vasárnap</option>
        </select>
        
      </div>

      <div>
        <label for="homerseklet">Hőmérséklet</label>
        <input name="homerseklet" id="homerseklet" type="number">        
      </div>

      <div>
      <button id="submit">Beküldés</button>
      </div>

    </form>

    <table id="tabla"></table>
    
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
